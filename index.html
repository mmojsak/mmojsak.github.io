<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mateusz Mojsak</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ovo&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Canvas for animated dispersion-curve background -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <main class="hero">
    <div class="hero-content">
      <h1 class="name">Mateusz Mojsak</h1>

      <div class="divider" role="presentation">
        <span class="divider-line" style="--divider-color: #ffb000;"></span>
        <span class="divider-diamond" style="--divider-color: #dc267f;"></span>
        <span class="divider-line" style="--divider-color: #648fff;"></span>
      </div>

      <p class="tagline">Researcher & Developer</p>

      <nav class="nav-grid" aria-label="Main navigation">
        <a href="#" class="nav-card" style="--card-color: #ffb000;">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
          </svg>
          <span class="nav-label">About</span>
        </a>
        <a href="#" class="nav-card" style="--card-color: #fe6100;">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
          <span class="nav-label">Publications</span>
        </a>
        <a href="#" class="nav-card" style="--card-color: #dc267f;">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12,2 22,22 2,22"/>
          </svg>
          <span class="nav-label">CV</span>
        </a>
        <a href="#" class="nav-card" style="--card-color: #785ef0;">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12,2 22,12 12,22 2,12"/>
          </svg>
          <span class="nav-label">Projects</span>
        </a>
      </nav>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
